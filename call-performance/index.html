<style>
/* Layout: tabs → filter row → targets → KPI tiles with mini-trends → full-width + paired chart cards → grouped scorecard table */
:root{

  --fg:#14181d; --fg2:#4b5460; --muted:#77808b;
  --out:#2a78d6; --in:#eb6834;
  --c-talk:#2a78d6; --c-idle:#eda100; --c-nr:#9aa3ad; --c-lunch:#1baf7a; --c-brk:#4a3aa7; --c-meet:#e87ba4; --c-other:#d5dae0;
  --good:#0e7c3a; --goodbg:#e3f4ea; --bad:#b42318; --badbg:#fdecea; --warn:#a15c00; --warnbg:#fdf1dc;
  --hm-good:#9fd8b4; --hm-bad:#f4a7a0; --hm-warn:#f5cf85; --hm-none:#edf0f4;
  --seq0:#e6effb; --seq1:#1f5fae; --barfill:#c9dcf5; --selbg:#eaf2fd; --s1:#a9c9f0; --s2:#5b9be0; --s3:#1f5fae;
  --display:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}

  --bg:#101317; --panel:#191d23; --line:#2a3039; --grid:#222730;
  --fg:#eef1f4; --fg2:#b4bcc6; --muted:#8a939e;
  --out:#3987e5; --in:#d95926;
  --c-talk:#3987e5; --c-idle:#c98500; --c-nr:#6b7480; --c-lunch:#199e70; --c-brk:#9085e9; --c-meet:#d55181; --c-other:#3a414b;
  --good:#5fd08a; --goodbg:#16311f; --bad:#ff8a80; --badbg:#3a1a19; --warn:#f0b35a; --warnbg:#3a2c12;
  --hm-good:#2e6b47; --hm-bad:#8c3b36; --hm-warn:#7d5d1e; --hm-none:#222730;
  --seq0:#1f2731; --seq1:#6aa8f0; --barfill:#2a3f5c; --selbg:#1f2a38; --s1:#2c4a70; --s2:#3f7bc4; --s3:#8bbcf5; color-scheme:dark}}
:root[data-theme="dark"]{

  --fg:#eef1f4; --fg2:#b4bcc6; --muted:#8a939e;
  --out:#3987e5; --in:#d95926;
  --c-talk:#3987e5; --c-idle:#c98500; --c-nr:#6b7480; --c-lunch:#199e70; --c-brk:#9085e9; --c-meet:#d55181; --c-other:#3a414b;
  --good:#5fd08a; --goodbg:#16311f; --bad:#ff8a80; --badbg:#3a1a19; --warn:#f0b35a; --warnbg:#3a2c12;

  --seq0:#1f2731; --seq1:#6aa8f0; --barfill:#2a3f5c; --selbg:#1f2a38; --s1:#2c4a70; --s2:#3f7bc4; --s3:#8bbcf5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--fg2);margin:4px 0 0}
.pill{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:999px;color:var(--fg2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:600 14px var(--display);color:var(--fg2);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--out)}
.tabs button:hover{color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--out);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:20px}
.panel[hidden]{display:none}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.toolbar label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
select{font:600 14px var(--display);padding:8px 34px 8px 12px;border:1px solid var(--line);border-radius:6px;background-color:var(--panel);color:var(--fg);cursor:pointer;min-width:220px;appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--fg2) 50%),linear-gradient(135deg,var(--fg2) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.excl{font-size:12.5px;color:var(--muted);margin:0}
.note{font-size:12px;color:var(--muted);margin:0}
.kind{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;white-space:nowrap}
h2 .kind{font-size:11px;margin-left:4px}
.qn{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500;margin-right:6px}

/* targets + KPI tiles */
.targets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tgc{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--good);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tgc.warn{border-top-color:var(--warn)} .tgc.bad{border-top-color:var(--bad)}
.tgc .q,.kpi .q{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tgc .v{font-size:18px;font-weight:600}
.tgc .d,.kpi .d{font-size:12px;color:var(--fg2)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--panel);padding:14px 16px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.01em}
.mini{margin-top:8px;height:30px;position:relative}
.spark{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spark-end{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--panel)}
.strip{position:absolute;left:4px;right:4px;top:50%;height:0;border-top:1px solid var(--line)}
.strip .dt{position:absolute;top:0;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:var(--out);box-shadow:0 0 0 2px var(--panel);cursor:default}
.strip .dt.dim{background:var(--c-nr)}
.strip .tk{position:absolute;top:-8px;height:16px;border-left:2px solid var(--fg)}
.strip .lbl{position:absolute;top:8px;font:10px var(--mono);color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.mini-cap{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--muted);margin-top:16px}

/* cards + charts */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card.wide{grid-column:1/-1}
.card h2{font-size:15px;margin:0;font-weight:600}
.chead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.chart{width:100%;min-height:120px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg)}
.seg button{font:600 12px var(--display);border:0;background:none;color:var(--fg2);padding:6px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 -2px 0 var(--out)}
.pw{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.perf{border-left:4px solid var(--good)}
.perf.worst{border-left-color:var(--bad)}
.perf .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--goodbg);color:var(--good)}
.perf.worst .tag{background:var(--badbg);color:var(--bad)}
.perf .who{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.perf .name{font-size:28px;font-weight:700}
.perf .score{font-family:var(--mono);color:var(--fg2);font-size:13px}
.perf ul{margin:0;padding-left:18px;color:var(--fg2);display:flex;flex-direction:column;gap:3px}
.method{font-size:12.5px;color:var(--fg2);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 24px}
.method p{margin:0} .method b{color:var(--fg)}

/* individual view */
.indiv{border-top:4px solid var(--out)}
.indiv .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.indiv .nm{font-size:28px;font-weight:700}
.indiv .meta{font-family:var(--mono);color:var(--fg2);font-size:13px}
.itiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.it{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.it .q{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.it .v{font-size:21px;font-weight:600}
.it .d{font-size:12px;color:var(--fg2)}
.cmp{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
.cmp.up{background:var(--goodbg);color:var(--good)} .cmp.dn{background:var(--badbg);color:var(--bad)} .cmp.eq{background:var(--grid);color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.three h3,.vs h3{font-size:13px;margin:0 0 4px;font-weight:600}
.vs{display:flex;flex-direction:column;gap:4px}
.vsrow{display:grid;grid-template-columns:170px minmax(0,1fr) 120px;align-items:center;gap:12px;font-size:12.5px;min-height:30px}
.vsrow .mini{margin:0;height:24px}
.vsrow .val{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.vsrow .strip .lbl{display:none}

/* tables */
.tblbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-right:2px}
.chip-t{font:600 12px var(--display);border:1px solid var(--line);background:var(--panel);color:var(--fg2);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip-t[aria-pressed="true"]{background:var(--selbg);color:var(--fg);border-color:var(--out)}
.btn{font:600 12px var(--display);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--out)}
.cfkey{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:12px;color:var(--fg2);align-items:center}
.cfkey .k{padding:1px 8px;border-radius:4px}
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;background:var(--panel);z-index:2}
thead tr.g th{top:0;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);font-weight:700;text-align:center;border-bottom:2px solid var(--line);padding:7px 12px}
thead tr.g th.gb{border-left:1px solid var(--line)}
thead tr.h th{top:31px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;vertical-align:bottom;line-height:1.3}
thead tr.h th:hover{color:var(--fg)}
thead tr.h th.ns{cursor:default}
th.gb,td.gb{border-left:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--panel)}
thead th:first-child{z-index:3}
td{font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--panel)}
td:first-child{font-family:var(--display);font-weight:600}
tbody tr:hover td{background:var(--grid)}
tbody tr.sel td{background:var(--selbg)}
tr.tot td{font-weight:600;background:var(--grid);border-bottom:0}
td.bar{background-image:linear-gradient(90deg,var(--barfill),var(--barfill));background-repeat:no-repeat;background-size:calc((100% - 24px) * var(--w)) 4px;background-position:12px calc(100% - 4px)}
td.cf.ok{background-color:var(--goodbg);color:var(--good)} td.cf.bad{background-color:var(--badbg);color:var(--bad)} td.cf.warn{background-color:var(--warnbg);color:var(--warn)}
td svg.sp{display:block;width:90px;height:22px;margin-left:auto}
.cbul{display:inline-flex;align-items:center;gap:8px}
.cbul i{position:relative;display:inline-block;width:70px;height:6px;background:var(--grid);border-radius:3px}
.cbul i b{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.cbul i u{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--fg)}
.chip{display:inline-block;font-family:var(--display);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px}
.chip.b{background:var(--goodbg);color:var(--good)} .chip.w{background:var(--badbg);color:var(--bad)}
.v-bad{color:var(--bad)} .v-good{color:var(--good)}
.tgt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.tgt .q{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tgt-ctl{display:flex;align-items:center;gap:8px;font-family:var(--mono)}
.tgt-ctl input{width:110px;font:500 20px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;z-index:20;display:none;max-width:280px;line-height:1.4}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:8px;z-index:30}
.drop{position:relative;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:8px;padding:22px 16px;background:var(--bg);cursor:pointer;text-align:center;color:var(--fg2)}
.drop.over{border-color:var(--out);background:var(--selbg)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop:focus-within{outline:2px solid var(--out);outline-offset:2px}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.flist li{display:flex;gap:6px;align-items:baseline;min-width:0;flex-wrap:wrap}
.flist li span{color:var(--muted);font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.flist li.ok b{color:var(--good)} .flist li.no b{color:var(--bad)}
.up-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.fld input[type=date]{font:500 14px var(--mono);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.up-act{margin-left:auto}
.btn.pri{background:var(--out);border-color:var(--out);color:#fff;padding:9px 16px;font-size:13px}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{color:var(--bad)}
.day-bar{gap:12px 24px}
.day-bar .seg button:disabled{color:var(--muted);opacity:.6;cursor:not-allowed}
.empty h2{font-size:15px;margin:0}
.card[hidden],#d-body[hidden],#up-card[hidden]{display:none}
.snap-act{display:flex;justify-content:flex-end}
@media (max-width:900px){.up-act{margin-left:0}.kpi .v{font-size:20px}.tgc .v{font-size:16px}.grid2,.pw,.three{grid-template-columns:1fr}.targets,.kpis,.itiles{grid-template-columns:repeat(2,minmax(0,1fr))}.vsrow{grid-template-columns:120px minmax(0,1fr) 92px}select{min-width:0;width:100%}.toolbar label{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// ---------- Call report parsing (runs in the browser; tested in node) ----------
(function(G){
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}
// rows -> objects; a row equal to a header-looking row restarts the header (CDR exports repeat headers)
function toObjects(rows,headerTest){
  let h=null;const out=[];
  for(const r of rows){ if(headerTest(r)){h=r.map(x=>x.trim());continue} if(!h)continue;
    const o={};h.forEach((k,i)=>o[k]=(r[i]??'').trim());out.push(o)}
  return out;
}
const hms=s=>{if(!s)return 0;const p=String(s).trim().split(':').map(Number);if(p.some(isNaN))return 0;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]};
const num=s=>{const v=parseFloat(String(s).replace(/,/g,''));return isNaN(v)?0:v};
const KINDS={
  production:{test:r=>r.includes('Member Name')&&r.includes('Ready Time')&&r.includes('Inbound Total')},
  login:{test:r=>r.includes('Member Name')&&r.includes('Login Time')&&r.includes('Logout Time')&&r.includes('Work Date')},
  missed:{test:r=>r.includes('Member Name')&&r.includes('Disposition')&&r.includes('Customer Phone')},
  cdr:{test:r=>r.includes('SNo')&&r.includes('MemberName')&&r.includes('CallDirection')},
  breaks:{test:r=>r.includes('Member Name')&&r.includes('Break Time')&&r.includes('Lunch Time')&&!r.includes('Ready Time')},
  queue:{test:r=>r.includes('Queue Group Name')},
};
function detect(rows){for(const [k,v] of Object.entries(KINDS)){if(rows.slice(0,3).some(r=>v.test(r.map(x=>x.trim()))))return k}return null}
const LABEL={production:'Production report',login:'Login report',missed:'Missed calls report',cdr:'Call log (CDR)',breaks:'Break report',queue:'Queue missed report'};
const tod=dt=>{const m=String(dt).match(/(\d{2}):(\d{2})(?::(\d{2}))?/);return m?(+m[1])*3600+(+m[2])*60+(+(m[3]||0)):null};
const dpart=dt=>{const m=String(dt).match(/(\d{4}-\d{2}-\d{2})/);return m?m[1]:null};

// files: [{name, text}] -> {agents:{id:{...}}, files:[...], dates:[...], hasCdr}
function buildSnapshot(files){
  const A={};const info=[];const dates=new Set();
  const ag=id=>A[id]||(A[id]={login:0,ready:0,notready:0,brk:0,lunch:0,meet:0,query:0,inTot:0,inAns:0,outTot:0,outAns:0,talkIn:0,talkOut:0,missed:0,firstLogin:null,lastLogout:null,hourly:null,ext:''});
  const isAgent=n=>/^Hue\d+$/i.test(String(n).trim());
  const parsed=files.map(f=>{const rows=parseCSV(f.text);return{f,rows,kind:detect(rows)}});
  for(const {f,rows,kind} of parsed){
    const fileDates=(f.name.match(/\d{4}-\d{2}-\d{2}/g)||[]);
    if(!kind){info.push({name:f.name,kind:null,rows:0});continue}
    const objs=toObjects(rows,KINDS[kind].test);let used=0;
    if(kind==='production'){for(const o of objs){const id=o['Member Name'];if(!isAgent(id))continue;const a=ag(id);used++;
      a.ext=o['Member Extension']||a.ext;a.login+=hms(o['Login Time']);a.ready+=hms(o['Ready Time']);a.notready+=hms(o['Not Ready Time']);
      a.brk+=hms(o['Break Time']);a.lunch+=hms(o['Lunch Time']);a.meet+=hms(o['Meeting Time']);a.query+=hms(o['Query Time']);
      a.inTot+=num(o['Inbound Total']);a.inAns+=num(o['Inbound Answered']);a.outTot+=num(o['Outbound Total']);a.outAns+=num(o['Outbound Answered']);
      a.talkIn+=hms(o['Inbound Talk Time']);a.talkOut+=hms(o['Outbound Talk Time'])}
      if(fileDates.length)dates.add(fileDates[fileDates.length-1]);}
    else if(kind==='login'){for(const o of objs){const id=o['Member Name'];if(!isAgent(id))continue;const a=ag(id);used++;
      const li=tod(o['Login Time']),lo=tod(o['Logout Time']);if(o['Work Date'])dates.add(o['Work Date']);
      if(li!=null&&(a.firstLogin==null||li<a.firstLogin))a.firstLogin=li;
      if(lo!=null&&dpart(o['Logout Time'])===o['Work Date']&&!/23:59:59/.test(o['Logout Time'])&&(a.lastLogout==null||lo>a.lastLogout))a.lastLogout=lo}}
    else if(kind==='missed'){for(const o of objs){const id=o['Member Name'];if(!isAgent(id))continue;ag(id).missed++;used++}}
    else if(kind==='cdr'){for(const o of objs){const id=o['MemberName'];if(!isAgent(id))continue;used++;const a=ag(id);
      if(!a.hourly)a.hourly=new Array(24).fill(0);const d=o['CallDisposition']||'';const t=tod(o['CallDateTime']);const dd=dpart(o['CallDateTime']);if(dd)dates.add(dd);
      if(t!=null&&/ANSWERED|TRANSFER/i.test(d))a.hourly[Math.floor(t/3600)]++}}
    else if(kind==='breaks'){for(const o of objs){if(isAgent(o['Member Name']))used++}}
    info.push({name:f.name,kind,rows:used});
  }
  const ds=[...dates].sort();
  return{agents:A,files:info,dates:ds,hasCdr:Object.values(A).some(a=>a.hourly)};
}
G.CallParse={parseCSV,buildSnapshot,LABEL};
})(typeof window!=='undefined'?window:globalThis);

</script>

function spark(arr,colorVar,{tipFn}={}){

function strip(list,valFn,fmt,{target,targetLbl,sel,higher=true}={}){

const TABS=[['tb-day','tab-day'],['tb-cc','tab-cc'],['tb-gx','tab-gx'],['tb-fb','tab-fb']];
function showTab(id){TABS.forEach(([b,p])=>{const on=b===id;$('#'+b).setAttribute('aria-selected',on);$('#'+p).hidden=!on});try{localStorage.setItem('hueTab4',id)}catch(e){}requestAnimationFrame(refreshVisible)}
TABS.forEach(([b])=>$('#'+b).addEventListener('click',()=>showTab(b)));
$('.tabs').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;const i=TABS.findIndex(([b])=>b===document.activeElement.id);if(i<0)return;const j=(i+(e.key==='ArrowRight'?1:TABS.length-1))%TABS.length;$('#'+TABS[j][0]).focus();showTab(TABS[j][0])});
function remember(k,v){try{localStorage.setItem(k,v)}catch(e){}} function recall(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function selector(id,list){return `<div class="toolbar"><label for="${id}">View<select id="${id}"><option value="">All agents (team view)</option>${list.map(a=>`<option value="${a.v}">${a.t}</option>`).join('')}</select></label></div>`}
function seg(id,opts,cur){return `<div class="seg" role="group" id="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`}
function bindSeg(id,cb){const g=$('#'+id);g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.v)})}
const tgt=ok=>`<span class="cmp ${ok?'up':'dn'}">${ok?'✓ met':'✗ missed'}</span>`;
function cmp(v,avg,higherGood){if(!avg)return'';const d=(v-avg)/avg;if(Math.abs(d)<0.03)return`<span class="cmp eq">≈ team</span>`;const good=higherGood?d>0:d<0;return`<span class="cmp ${good?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d*100).toFixed(0)}%</span>`}

// ---------- advanced table ----------
// cols: {g, h, k, v(a), f(a), t (total html), cf(a), bar:true, spark(a), ns}
function advTable(root,{id,cols,groups,rows,st,total,copyName,isSel}){
 root.innerHTML=`<div class="tblbar"><div class="chips"><span>Show</span>${groups.filter(g=>g.key).map(g=>`<button type="button" class="chip-t" data-g="${g.key}" aria-pressed="${!st.hide[g.key]}">${g.label}</button>`).join('')}</div><button type="button" class="btn" id="${id}-copy">Copy table</button></div><div class="tw"><table id="${id}"></table></div>`;
 const tbl=root.querySelector('table');
 const maxOf={};cols.forEach((c,i)=>{if(c.bar)maxOf[i]=Math.max(...rows.map(c.v),1)});
 function draw(){
  const vis=cols.map((c,i)=>({c,i})).filter(({c})=>!c.g||!st.hide[c.g]);
  const R=[...rows].sort((a,b)=>{const c=cols[st.k];const x=c.v(a),y=c.v(b);return (x>y?1:x<y?-1:0)*st.d});
  const gr=[];vis.forEach(({c})=>{const g=c.g||'';if(gr.length&&gr[gr.length-1].g===g)gr[gr.length-1].n++;else gr.push({g,n:1})});
  const first=new Set();let prev=null;vis.forEach(({c,i})=>{if((c.g||'')!==prev&&c.g)first.add(i);prev=c.g||''});
  const gb=i=>first.has(i)?' gb':'';
  tbl.innerHTML=`<thead><tr class="g">${gr.map(x=>`<th colspan="${x.n}" class="${x.g?'gb':''}">${(groups.find(g=>g.key===x.g)||{}).label||''}</th>`).join('')}</tr>
  <tr class="h">${vis.map(({c,i})=>`<th class="${c.ns?'ns':''}${gb(i)}" ${c.ns?'':`tabindex="0" data-i="${i}" aria-sort="${i===st.k?(st.d>0?'ascending':'descending'):'none'}"`}>${c.h}${c.k?KIND(c.k):''}${i===st.k?(st.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
  <tbody>${R.map(a=>`<tr class="${isSel&&isSel(a)?'sel':''}">${vis.map(({c,i})=>{const cls=[];let style='';if(c.cf){const r=c.cf(a);if(r)cls.push('cf',r)}if(c.bar){cls.push('bar');style=` style="--w:${Math.max(c.v(a),0)/maxOf[i]}"`}if(first.has(i))cls.push('gb');
   return `<td class="${cls.join(' ')}"${style}>${c.spark?c.spark(a):c.f(a)}</td>`}).join('')}</tr>`).join('')}
  ${total?`<tr class="tot">${vis.map(({c,i})=>`<td class="${first.has(i)?'gb':''}">${i===0?total:(c.t??'')}</td>`).join('')}</tr>`:''}</tbody>`;}
 tbl.addEventListener('click',e=>{const th=e.target.closest('th[data-i]');if(!th)return;const i=+th.dataset.i;st.d=i===st.k?-st.d:-1;st.k=i;draw()});
 tbl.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('th[data-i]'))e.target.click()});
 root.querySelector('.chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.hide[b.dataset.g]=!st.hide[b.dataset.g];b.setAttribute('aria-pressed',!st.hide[b.dataset.g]);draw()});
 root.querySelector('#'+id+'-copy').addEventListener('click',()=>{
  const vis=cols.filter(c=>(!c.g||!st.hide[c.g])&&!c.spark);
  const txt=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.trim()};
  const R=[...rows].sort((a,b)=>{const c=cols[st.k];const x=c.v(a),y=c.v(b);return (x>y?1:x<y?-1:0)*st.d});
  const tsv=[vis.map(c=>c.h+(c.k?` (${c.k})`:'')).join('\t'),...R.map(a=>vis.map(c=>txt(c.f(a))).join('\t'))].join('\n');
  const done=()=>toast(`Copied ${R.length} rows — paste into Excel or Sheets`);
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=tsv;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();ok?done():toast('Copy is blocked here. Select the table and copy it instead.')};
  try{navigator.clipboard.writeText(tsv).then(done,fallback)}catch(e){fallback()}});
 draw();return{draw};
}
function sparkCell(arr,colorVar,label){const W=90,H=22,mx=Math.max(...arr,1),N=arr.length;const pts=arr.map((v,i)=>`${(i/(N-1)*W).toFixed(1)},${(H-2-v/mx*(H-4)).toFixed(1)}`).join(' ');
 const peak=Math.max(...arr),pi=arr.indexOf(peak);
 return `<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-tip="${esc(`<b>${label}</b><br>Peak ${n(peak)} on ${dl(DATES[pi])}<br>Avg ${n(sum(arr)/Math.max(arr.filter(v=>v).length,1))} per working day`)}" role="img" aria-label="Daily trend"><polyline points="${pts}" fill="none" stroke="var(${colorVar})" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`}

 const A=ids.map(i=>byId[i]);const P=cfg.p;const st={sel:'',split:'pct',calls:'calls',heat:'calls'};

 const T={talk:S('talk'),talkIn:S('talkIn'),talkOut:S('talkOut'),handled:S('handled'),inAns:S('inAns'),outAns:S('outAns'),brk:S('brk'),lunch:S('lunch'),meet:S('meet'),login:S('login'),days:S('days'),missed:S('missed'),idle:S('idle'),notready:S('notready'),inTot:S('inTot'),outTot:S('outTot'),ready:S('ready')};
 const teamAht=T.talk/T.handled,teamOC=T.outAns/T.outTot;
 const AVG=k=>sum(A.map(a=>a[k]))/A.length;
 const op=a=>st.sel&&a.id!==st.sel?0.25:1;
 // ranking
 const W=[{w:25,lab:'Calls handled per day',f:a=>a.hpd,up:1},{w:25,lab:'Talk time per day',f:a=>a.tpd,up:1},{w:15,lab:'Outbound connect rate',f:a=>a.oc,up:1},{w:15,lab:'Inbound answer rate',f:a=>a.ia,up:1},{w:20,lab:'Idle + Not Ready share of login (lower is better)',f:a=>a.lost,up:0}];
 if(cfg.score){A.forEach(a=>a.score=0);W.forEach(m=>{const v=A.map(m.f),lo=Math.min(...v),hi=Math.max(...v);A.forEach(a=>{const x=(m.f(a)-lo)/(hi-lo||1);a.score+=m.w*(m.up?x:1-x)})});[...A].sort((a,b)=>b.score-a.score).forEach((a,i)=>a.rank=i+1)}
 const best=cfg.score?A.find(a=>a.rank===1):null,worst=cfg.score?A.find(a=>a.rank===A.length):null;
 // daily team series
 const tOut=DATES.map((_,i)=>sum(A.map(a=>a.dOut[i]))),tIn=DATES.map((_,i)=>sum(A.map(a=>a.dIn[i])));
 const tLoginAvg=DATES.map((_,i)=>{const L=A.filter(a=>a.dLogin[i]>0);return L.length?sum(L.map(a=>a.dLogin[i]))/L.length:0});
 const tBLAvg=DATES.map((_,i)=>{const L=A.filter(a=>a.dLogin[i]>0);return L.length?sum(L.map(a=>a.dBrk[i]+a.dLunch[i]))/L.length:0});
 const wide=cfg.p==='cc';

 root.innerHTML=selector(P+'-sel',A.map(a=>({v:a.id,t:`${a.name} (${a.id})`})))+
 `<p class="excl">${cfg.scope}</p>
 <section class="targets" id="${P}-tg"></section>
 <div id="${P}-ind"></div>
 <section class="kpis" id="${P}-kpis"></section>
 ${cfg.score?`<section class="pw" id="${P}-perf"></section>`:''}

  <div class="card wide"><div class="chead"><h2><span class="qn">Q8 · Q3 · Q6</span>Where the logged-in time goes <span class="kind">(Total)</span></h2>${seg(P+'-split',[['pct','% of time'],['hrs','Hours']],'pct')}</div><div class="chart" id="${P}-c-split"></div>
   <p class="note"><b>Idle</b> = Ready with no call connected (waiting, dialling, ringing). <b>Not Ready</b> = logged in but switched off from calls. Shares are of all status time in the Production report; agents are sorted by talk share.</p></div>
  <div class="card"><div class="chead"><h2><span class="qn">Q5 · Q1 · Q9</span>Calls and talk time <span class="kind">(Total)</span></h2>${seg(P+'-calls',[['calls','Calls handled'],['talk','Talk time']],'calls')}</div><div class="chart" id="${P}-c-calls"></div></div>
  <div class="card"><h2><span class="qn">Q9</span>Outbound volume vs connect rate <span class="kind">(Total · Rate)</span></h2><div class="chart" id="${P}-c-sc"></div><p class="note">Bubble size = outbound calls connected. Dashed line = team connect rate.</p></div>
  <div class="card"><h2><span class="qn">Q2</span>Average handle time vs target <span class="kind">(Avg/call)</span></h2><div class="chart" id="${P}-c-aht"></div><p class="note">AHT = talk time ÷ calls handled. Green meets the 2:00 target.</p></div>
  <div class="card"><h2><span class="qn">Q4</span>Logged-in time vs target <span class="kind">(Avg/day)</span></h2><div class="chart" id="${P}-c-login"></div><p class="note">Grey band = 7h 30m target. Right column: average · days under target.</p></div>

  <div class="card"><h2><span class="qn">Q7</span>Missed inbound calls <span class="kind">(Total)</span></h2><div class="chart" id="${P}-c-missed"></div><p class="note">From the Missed Calls report. Right column: missed · share of inbound answered.</p></div>
  <div class="card"><h2><span class="qn">Q9</span>Team calls per day <span class="kind">(Daily)</span></h2><div class="chart" id="${P}-c-trend"></div><p class="note">Drag the slider or scroll on the chart to zoom into a date range.</p></div>
  ${cfg.extra||''}
 </section>
 <section class="card"><h2><span class="qn">All</span>Agent scorecard</h2>

  <div id="${P}-tblwrap"></div></section>
 ${cfg.score?`<section class="card"><h2><span class="qn">Q10</span>How the ranking works</h2><div class="method">${W.map(m=>`<p><b>${m.w}% · ${m.lab}.</b> Agents are scaled from the team's lowest (0) to highest (${m.w}) on this measure${m.up?'':', reversed'}.</p>`).join('')}<p><b>Rank.</b> The weighted points are added up and agents are ranked 1 (best) to ${A.length}.</p></div></section>`:''}`;

 // ---- targets ----

 <div class="up-row"><label class="fld" for="up-date">Date<input type="date" id="up-date"></label>
  <div class="fld"><span>Upload time</span>${seg('up-slot',SLOTS,guessSlot())}</div>
  <div class="up-act"><button type="button" class="btn pri" id="up-save" disabled>Save snapshot</button></div></div>
 <p class="note" id="up-msg" role="status"></p>
</section>
<div class="toolbar day-bar">
 <label for="d-date">Date<select id="d-date"></select></label>
 <div class="fld"><span>Time</span><div class="seg" role="group" id="d-slot"></div></div>
 <label for="d-team">Team<select id="d-team"><option value="cc">Customer Champion (9)</option><option value="fb">Feedback team (2)</option><option value="all">All agents</option></select></label>
</div>
<div id="d-empty" class="card empty" hidden></div>
<div id="d-body" hidden>
 <p class="excl" id="d-meta"></p>
 <section class="kpis" id="d-kpis"></section>
 <section class="grid2">
  <div class="card wide"><h2>Progress through the day <span class="kind">(Calls handled at each upload)</span></h2><div class="chart" id="d-c-prog"></div><p class="note">Each bar is the running total at that upload time. Missing bars mean that upload hasn't been made yet.</p></div>
  <div class="card"><h2>Talk time and AHT <span class="kind">(So far today)</span></h2><div class="chart" id="d-c-talk"></div><p class="note">Bar = talk time so far. Right column: AHT, green when at least the 2:00 target.</p></div>
  <div class="card"><h2>Calls per hour <span class="kind">(Team, from the call log)</span></h2><div class="chart" id="d-c-hour"></div><p class="note" id="d-hour-note">Connected calls in each hour of the day.</p></div>
  <div class="card wide"><h2>Where the logged-in time went <span class="kind">(So far today)</span></h2><div class="chart" id="d-c-split"></div><p class="note">Idle = Ready with no call connected. Not Ready = logged in but switched off from calls.</p></div>
 </section>
 <section class="card"><h2>Agent scorecard <span class="kind" id="d-tbl-kind"></span></h2>
  <div class="cfkey"><span class="k" style="background:var(--goodbg);color:var(--good)">Meets target</span><span class="k" style="background:var(--badbg);color:var(--bad)">Misses target</span><span>AHT 2:00 minimum · break 30m and lunch 1h maximum · login 7h 30m is checked on the 6:30 PM upload only. "+ since" = calls handled since the previous upload.</span></div>
  <div id="d-tbl"></div>
  <div class="snap-act" id="d-act"></div>
 </section>
</div>`;

// ---------- upload ----------
const upIn=$('#up-in'),drop=$('#drop'),upDate=$('#up-date');let upSlot=guessSlot();
upDate.value=istNow().date;
bindSeg('up-slot',v=>{upSlot=v;refreshSave()});
upIn.addEventListener('change',()=>takeFiles([...upIn.files]));
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>takeFiles([...ev.dataTransfer.files].filter(f=>/\.csv$/i.test(f.name))));
async function takeFiles(list){
 if(!list.length)return;$('#up-msg').textContent='Reading files…';
 const files=await Promise.all(list.map(async f=>({name:f.name,text:await f.text()})));
 const snap=CallParse.buildSnapshot(files);st.pending=snap;
 const rows=snap.files.map(f=>`<li class="${f.kind?'ok':'no'}"><b>${f.kind?CallParse.LABEL[f.kind]:'Not recognised'}</b> <span>${esc(f.name)}</span>${f.kind?` · ${n(f.rows)} agent rows`:''}</li>`).join('');
 const hasProd=snap.files.some(f=>f.kind==='production');
 $('#up-list').innerHTML=`<ul class="flist">${rows}</ul>`;
 if(snap.dates.length){upDate.value=snap.dates[snap.dates.length-1]}
 let msg=hasProd?`Ready to save ${Object.keys(snap.agents).filter(k=>k!=='Hue1006').length} agents.`:'Add the Production report. It carries calls, talk time, breaks and login hours.';
 if(snap.dates.length>1)msg+=` These files cover ${dl(snap.dates[0])} – ${dl(snap.dates[snap.dates.length-1])}; daily uploads should cover one day only.`;
 $('#up-msg').textContent=msg;refreshSave();
}
function refreshSave(){const ok=st.pending&&st.pending.files.some(f=>f.kind==='production')&&upDate.value;
 const b=$('#up-save');b.disabled=!ok;const id=`${upDate.value}_${upSlot}`;
 b.textContent=SNAPS[id]&&!SNAPS[id].local?`Replace ${slotLbl(upSlot)} snapshot`:'Save snapshot'}
upDate.addEventListener('change',refreshSave);
$('#up-save').addEventListener('click',async()=>{
 const id=`${upDate.value}_${upSlot}`;const b=$('#up-save');
 if(SNAPS[id]&&!SNAPS[id].local&&b.dataset.confirm!==id){b.dataset.confirm=id;b.textContent='Click again to replace';$('#up-msg').textContent=`A ${slotLbl(upSlot)} snapshot already exists for ${longDate(upDate.value)}. Click again to replace it.`;return}
 b.dataset.confirm='';const s=st.pending;
 const agents={...s.agents};delete agents.Hue1006;
 const body={date:upDate.value,slot:upSlot,savedAt:new Date().toISOString(),savedBy:st.uid||'',files:s.files,hasCdr:s.hasCdr,agents};
 if(!st.db){SNAPS[id]={...body,local:true};$('#up-msg').textContent=`Showing ${slotLbl(upSlot)} for ${longDate(upDate.value)} as a preview. It is not saved, because saving only works when the dashboard is opened in Claude.`;afterSave(id);return}
 b.disabled=true;$('#up-msg').textContent='Saving…';
 try{await st.db.doc('snapshots/'+id).set(body);SNAPS[id]=body;$('#up-msg').textContent=`Saved: ${slotLbl(upSlot)} snapshot for ${longDate(upDate.value)}. Everyone with the link now sees it.`;afterSave(id)}
 catch(e){b.disabled=false;$('#up-msg').textContent=e&&e.code==='bad_key'?'The upload key is missing or wrong. Enter the upload key set on Render and try again.':e&&e.code==='invalid_argument'?'You can view this dashboard but not save to it. Ask the owner for edit access.':e&&e.code==='quota_exceeded'?'The dashboard storage is full. Delete some old snapshots and try again.':'Could not save just now. Try again in a moment.'}
});
function afterSave(id){st.pending=null;upIn.value='';$('#up-list').innerHTML='';const [d,s]=id.split('_');st.date=d;st.slot=s;renderPickers();renderAll();refreshSave()}

// ---------- pickers ----------
const dates=()=>[...new Set(Object.values(SNAPS).map(x=>x.date))].sort().reverse();
function renderPickers(){
 const ds=dates();const sel=$('#d-date');
 if(!ds.includes(st.date))st.date=ds[0]||'';
 sel.innerHTML=ds.length?ds.map(d=>`<option value="${d}">${longDate(d)}</option>`).join(''):'<option value="">No uploads yet</option>';sel.value=st.date;
 const have=SLOTS.filter(([s])=>SNAPS[`${st.date}_${s}`]).map(x=>x[0]);
 if(!have.includes(st.slot))st.slot=have[have.length-1]||'';
 $('#d-slot').innerHTML=SLOTS.map(([s,l])=>`<button type="button" data-v="${s}" aria-pressed="${s===st.slot}" ${have.includes(s)?'':'disabled'}>${l}${have.includes(s)?'':' · not yet'}</button>`).join('');
}
$('#d-date').addEventListener('change',e=>{st.date=e.target.value;st.slot='';renderPickers();renderAll()});
$('#d-slot').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;st.slot=b.dataset.v;renderPickers();renderAll()});
$('#d-team').addEventListener('change',e=>{st.team=e.target.value;remember('dayTeam',st.team);renderAll()});
const rt=recall('dayTeam');if(rt){st.team=rt;$('#d-team').value=rt}

// ---------- derived data ----------
function rowsFor(snap){
 const ids=(st.team==='all'?DAY_ALL:TEAM[st.team]).filter(id=>snap.agents[id]);
 return ids.map(id=>{const a=snap.agents[id];const talk=a.talkIn+a.talkOut,handled=a.inAns+a.outAns;
  return{id,name:NAME[id]||id,...a,talk,handled,calls:a.inTot+a.outTot,aht:handled?talk/handled:0,idle:Math.max(a.ready-talk,0),oc:a.outTot?a.outAns/a.outTot:0,ia:a.inTot?a.inAns/a.inTot:0}});
}
const cur=()=>SNAPS[`${st.date}_${st.slot}`];
function prevSnap(){const i=SLOTS.findIndex(x=>x[0]===st.slot);for(let j=i-1;j>=0;j--){const p=SNAPS[`${st.date}_${SLOTS[j][0]}`];if(p)return{snap:p,slot:SLOTS[j][0]}}return null}

// ---------- render ----------
let tableSt={k:1,d:1,hide:{}};
function renderAll(){
 const snap=cur();const body=$('#d-body'),empty=$('#d-empty');
 if(!snap){body.hidden=true;empty.hidden=false;
  empty.innerHTML=st.live||!window.claude?`<h2>No uploads yet</h2><p class="note">Upload today's reports above at 1:30 PM, 4:30 PM or 6:30 PM. Each upload becomes a snapshot you can come back to from the Date and Time pickers.</p>`:`<p class="note">Loading saved snapshots…</p>`;return}
 empty.hidden=true;body.hidden=false;
 const R=rowsFor(snap);const S=k=>sum(R.map(r=>r[k]));const T={};['talk','handled','calls','login','brk','lunch','missed','idle','notready','outAns','inAns','outTot','inTot','talkIn','talkOut','ready','meet'].forEach(k=>T[k]=S(k));
 const p=prevSnap();const pr=p?Object.fromEntries(rowsFor(p.snap).map(r=>[r.id,r])):null;
 const kinds=snap.files.filter(f=>f.kind).map(f=>CallParse.LABEL[f.kind]);
 $('#d-meta').textContent=`${longDate(snap.date)} · ${slotLbl(snap.slot)} upload · ${R.length} agents · from ${kinds.join(', ')}${snap.local?' · preview, not saved':''}`;
 const late=snap.slot==='1830';
 const K=[['Calls handled',n(T.handled),p?`+${n(T.handled-sum(Object.values(pr).map(r=>r.handled)))} since ${slotLbl(p.slot)}`:`of ${n(T.calls)} attempted`],
  ['Talk time',hm(T.talk),`${hm(T.talkOut)} out · ${hm(T.talkIn)} in`],
  ['AHT (Avg/call)',ms(T.handled?T.talk/T.handled:0),`target 2:00 · ${R.filter(r=>r.aht>=TGT.aht).length} of ${R.length} meet it`],
  ['Outbound / Inbound',`${n(T.outAns)} / ${n(T.inAns)}`,`connect ${pct(T.outTot?T.outAns/T.outTot:0)} · answer ${pct(T.inTot?T.inAns/T.inTot:0)}`],
  ['Logged in (Avg/agent)',hm(R.length?T.login/R.length:0),late?`${R.filter(r=>r.login>=TGT.login).length} of ${R.length} reached 7h 30m`:'login target is checked at 6:30 PM'],
  ['Break + lunch (Avg/agent)',hm(R.length?(T.brk+T.lunch)/R.length:0),`${R.filter(r=>r.brk>TGT.brk||r.lunch>TGT.lunch).length} agents over a limit`],
  ['Missed calls',n(T.missed),snap.files.some(f=>f.kind==='missed')?'inbound calls that rang an agent':'Missed Calls report not uploaded'],
  ['Idle (Total)',hm(T.idle),`plus ${hm(T.notready)} Not Ready`]];
 $('#d-kpis').innerHTML=K.map(([q,v,d])=>`<div class="kpi"><span class="q">${q}</span><span class="v">${v}</span><span class="d">${d}</span></div>`).join('');
 // table
 const cfMin=(v,t)=>v>=t?'ok':'bad',cfMax=(v,t)=>v<=t?'ok':'bad';
 const hasLogin=snap.files.some(f=>f.kind==='login');
 const cols=[{h:'Agent',v:r=>r.name,f:r=>r.name},
  ...(hasLogin?[{g:'att',h:'First login',k:'Time',v:r=>r.firstLogin??1e9,f:r=>clk(r.firstLogin)},{g:'att',h:'Logoff',k:'Time',v:r=>r.lastLogout??0,f:r=>late?clk(r.lastLogout):'–'}]:[]),
  {g:'att',h:'Logged in',k:'Total',v:r=>r.login,f:r=>hm(r.login),cf:late?r=>cfMin(r.login,TGT.login):null,t:hm(T.login)},
  {g:'calls',h:'Handled',k:'Total',v:r=>r.handled,f:r=>n(r.handled),bar:1,t:n(T.handled)},
  ...(pr?[{g:'calls',h:'+ since '+slotLbl(p.slot),k:'Calls',v:r=>r.handled-(pr[r.id]?.handled||0),f:r=>'+'+n(r.handled-(pr[r.id]?.handled||0)),t:'+'+n(T.handled-sum(R.map(r=>pr[r.id]?.handled||0)))}]:[]),
  {g:'calls',h:'Talk time',k:'Total',v:r=>r.talk,f:r=>hm(r.talk),bar:1,t:hm(T.talk)},
  {g:'calls',h:'AHT',k:'Avg/call',v:r=>r.aht,f:r=>ms(r.aht),cf:r=>cfMin(r.aht,TGT.aht),t:ms(T.handled?T.talk/T.handled:0)},
  {g:'io',h:'Out dialled',k:'Total',v:r=>r.outTot,f:r=>n(r.outTot),t:n(T.outTot)},
  {g:'io',h:'Out connected',k:'Total',v:r=>r.outAns,f:r=>n(r.outAns),t:n(T.outAns)},
  {g:'io',h:'Connect %',k:'Rate',v:r=>r.oc,f:r=>pct(r.oc),t:pct(T.outTot?T.outAns/T.outTot:0)},
  {g:'io',h:'In received',k:'Total',v:r=>r.inTot,f:r=>n(r.inTot),t:n(T.inTot)},
  {g:'io',h:'In answered',k:'Total',v:r=>r.inAns,f:r=>n(r.inAns),t:n(T.inAns)},
  {g:'io',h:'Missed',k:'Total',v:r=>r.missed,f:r=>n(r.missed),t:n(T.missed)},
  {g:'brk',h:'Break',k:'Total',v:r=>r.brk,f:r=>hm(r.brk),cf:r=>cfMax(r.brk,TGT.brk),t:hm(T.brk)},
  {g:'brk',h:'Lunch',k:'Total',v:r=>r.lunch,f:r=>hm(r.lunch),cf:r=>cfMax(r.lunch,TGT.lunch),t:hm(T.lunch)},
  {g:'brk',h:'Meeting',k:'Total',v:r=>r.meet+r.query,f:r=>hm(r.meet+r.query),t:hm(T.meet+S('query'))},
  {g:'use',h:'Idle',k:'Total',v:r=>r.idle,f:r=>hm(r.idle),bar:1,t:hm(T.idle)},
  {g:'use',h:'Not Ready',k:'Total',v:r=>r.notready,f:r=>hm(r.notready),bar:1,t:hm(T.notready)}];
 const groups=[{key:'',label:''},{key:'att',label:'Attendance'},{key:'calls',label:'Calls'},{key:'io',label:'Outbound & inbound'},{key:'brk',label:'Break & lunch'},{key:'use',label:'Time use'}];
 if(tableSt.k>=cols.length)tableSt.k=1;
 $('#d-tbl-kind').textContent=`(${slotLbl(snap.slot)} · so far today)`;
 advTable($('#d-tbl'),{id:'d-tbl-t',cols,groups,rows:R,st:tableSt,total:'Team'});
 const canDel=st.db&&st.canWrite!==false;
 $('#d-act').innerHTML=snap.local?'':(canDel?`<button type="button" class="btn ghost" id="d-del">Delete this snapshot</button>`:'');
 const del=$('#d-del');if(del)del.addEventListener('click',async()=>{
  if(del.dataset.c!=='1'){del.dataset.c='1';del.textContent=`Click again to delete the ${slotLbl(snap.slot)} snapshot for ${longDate(snap.date)}`;return}
  try{await st.db.doc(`snapshots/${snap.date}_${snap.slot}`).delete();delete SNAPS[`${snap.date}_${snap.slot}`];toast('Snapshot deleted');renderPickers();renderAll()}catch(e){toast('Could not delete. You may not have edit access.')}});
 if(!chartsMade){makeCharts();chartsMade=true}else CH.forEach(c=>{if(root.contains(c.el))drawChart(c)});
}

function makeCharts(){
 chart($('#d-c-prog'),()=>{const snap=cur();const R=rowsFor(snap);$('#d-c-prog').style.height=Math.max(180,R.length*44+70)+'px';
  const cols=['--s1','--s2','--s3'];
  return{...BASE(),legend:LEG(SLOTS.map(s=>s[1])),grid:{left:4,right:30,top:34,bottom:4,containLabel:true},
   tooltip:TT({trigger:'axis',axisPointer:{type:'shadow',shadowStyle:{color:rgba(css('--fg'),.05)}},formatter:ps=>{const r=R[ps[0].dataIndex];return `<b>${r.name}</b><br>`+SLOTS.map(([s,l])=>{const x=SNAPS[`${st.date}_${s}`];const a=x&&x.agents[r.id];return `${l}: ${a?n(a.inAns+a.outAns)+' handled':'not uploaded'}`}).join('<br>')}}),
   xAxis:VAX(n,{min:0}),yAxis:CAX(R.map(r=>r.name)),
   series:SLOTS.map(([s,l],i)=>({name:l,type:'bar',barWidth:9,barGap:'25%',itemStyle:{color:css(cols[i]),borderRadius:[0,3,3,0]},
    label:{show:s===st.slot,position:'right',color:css('--fg'),fontFamily:css('--mono'),fontSize:10.5,formatter:p=>p.value?n(p.value):''},
    data:R.map(r=>{const x=SNAPS[`${st.date}_${s}`];const a=x&&x.agents[r.id];return a?a.inAns+a.outAns:null})}))}});
 chart($('#d-c-talk'),()=>{const R=[...rowsFor(cur())].sort((a,b)=>b.talk-a.talk);$('#d-c-talk').style.height=hRows(R.length)+'px';
  return{...BASE(),grid:{left:4,right:16,top:10,bottom:4,containLabel:true},tooltip:TT({trigger:'axis',axisPointer:{type:'none'},formatter:ps=>{const r=R[ps[0].dataIndex];return `<b>${r.name}</b><br>Talk ${hm(r.talk)} (${hm(r.talkOut)} out · ${hm(r.talkIn)} in)<br>AHT ${ms(r.aht)} over ${n(r.handled)} calls`}}),
   xAxis:VAX(v=>{const t=Math.round(v/60);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')},(()=>{const mx=Math.max(...R.map(r=>r.talk),1),iv=mx>4*3600?3600:1800;return{min:0,interval:iv,max:Math.ceil(mx*1.05/iv)*iv}})()),yAxis:[CAX(R.map(r=>r.name)),RAX(R.map(r=>`${hm(r.talk)} · ${ms(r.aht)}`))],
   series:[{type:'bar',barWidth:14,data:R.map(r=>({value:r.talk,itemStyle:{color:css(r.aht>=TGT.aht?'--good':'--c-talk'),borderRadius:[0,4,4,0]}}))}]}});
 chart($('#d-c-hour'),()=>{const snap=cur();const R=rowsFor(snap);const H=new Array(24).fill(0);let any=false;R.forEach(r=>{if(r.hourly){any=true;r.hourly.forEach((v,i)=>H[i]+=v)}});
  $('#d-c-hour').style.height='240px';$('#d-hour-note').textContent=any?'Connected calls in each hour of the day, for the selected team.':'Upload the call log (CDR) with this snapshot to see calls per hour.';
  const hrs_=[];for(let h=8;h<=21;h++)hrs_.push(h);const lab=h=>(h%12||12)+(h<12?'a':'p');
  if(!any){$('#d-c-hour').style.height='120px';return{...BASE(),graphic:[{type:'text',left:'center',top:'middle',style:{text:'No call log in this upload',fill:css('--muted'),fontSize:13,fontFamily:css('--display')}}]}}
  return{...BASE(),grid:{left:4,right:12,top:16,bottom:4,containLabel:true},tooltip:TT({trigger:'axis',axisPointer:{type:'shadow',shadowStyle:{color:rgba(css('--fg'),.05)}},formatter:ps=>`<b>${lab(hrs_[ps[0].dataIndex])}–${lab(hrs_[ps[0].dataIndex]+1)}</b><br>${n(ps[0].value)} connected calls`}),
   xAxis:{type:'category',data:hrs_.map(lab),axisLine:{lineStyle:{color:css('--line')}},axisTick:{show:false},axisLabel:{color:css('--muted'),fontFamily:css('--mono'),fontSize:10.5}},yAxis:VAX(n,{min:0}),
   series:[{type:'bar',barWidth:'60%',data:hrs_.map(h=>H[h]),itemStyle:{color:css('--out'),borderRadius:[3,3,0,0]}}]}});
 const SEG=[['Talk','--c-talk',r=>r.talk],['Idle','--c-idle',r=>r.idle],['Not Ready','--c-nr',r=>r.notready],['Lunch','--c-lunch',r=>r.lunch],['Break','--c-brk',r=>r.brk],['Meeting / query','--c-meet',r=>r.meet+r.query]];
 chart($('#d-c-split'),()=>{const R=rowsFor(cur()).filter(r=>sum(SEG.map(s=>s[2](r)))>0);const tot=r=>sum(SEG.map(s=>s[2](r)));R.sort((a,b)=>b.talk/tot(b)-a.talk/tot(a));$('#d-c-split').style.height=hRows(R.length)+20+'px';
  return{...BASE(),legend:LEG(SEG.map(s=>s[0])),grid:{left:4,right:16,top:36,bottom:4,containLabel:true},
   tooltip:TT({trigger:'axis',axisPointer:{type:'shadow',shadowStyle:{color:rgba(css('--fg'),.05)}},formatter:ps=>{const r=R[ps[0].dataIndex];return `<b>${r.name}</b> · logged in ${hm(r.login)}<br>`+SEG.map(s=>`${dot(css(s[1]))}${s[0]}: <b>${hm(s[2](r))}</b> · ${pct(s[2](r)/tot(r))}`).join('<br>')}}),
   xAxis:VAX(v=>v+'%',{max:100,interval:20}),yAxis:CAX(R.map(r=>r.name)),
   series:SEG.map((s,si)=>({name:s[0],type:'bar',stack:'t',barWidth:20,itemStyle:{color:css(s[1]),borderColor:css('--panel'),borderWidth:1},
    label:{show:si<3,position:'inside',formatter:p=>p.value>=9?Math.round(p.value)+'%':'',color:si===2?css('--fg'):'#fff',fontSize:10.5,fontFamily:css('--mono')},
    data:R.map(r=>s[2](r)/tot(r)*100)}))}});
}

// ---------- connect to saved snapshots ----------
renderPickers();renderAll();
(async()=>{
 if(window.SERVER_MODE){
  st.live=true;const getKey=()=>{try{return localStorage.getItem('cpUploadKey')||''}catch(e){return''}};
  const row=root.querySelector('.up-row');const kl=document.createElement('label');kl.className='fld';kl.htmlFor='up-key';
  kl.innerHTML='Upload key<input type="password" id="up-key" autocomplete="current-password" placeholder="Needed to save">';row.insertBefore(kl,row.querySelector('.up-act'));
  const ki=$('#up-key');ki.value=getKey();ki.addEventListener('change',()=>{try{localStorage.setItem('cpUploadKey',ki.value.trim())}catch(e){}});
  $('#up-who').textContent='Only people with the upload key can save; everyone with the link can view.';
  const call=async(method,id,body)=>{const r=await fetch('/api/snapshots'+(id?'/'+encodeURIComponent(id):''),{method,headers:{'content-type':'application/json','x-upload-key':ki.value.trim()||getKey()},body:body?JSON.stringify(body):undefined});
   if(!r.ok)throw{code:r.status===401||r.status===403?'bad_key':r.status===413?'invalid_argument':'unavailable'};return method==='GET'?r.json():null};
  st.db={doc:p=>{const id=p.split('/')[1];return{set:b=>call('PUT',id,b),delete:()=>call('DELETE',id)}}};
  const load=async()=>{try{const list=await call('GET');for(const k in SNAPS)if(!SNAPS[k].local)delete SNAPS[k];list.forEach(v=>{if(v&&v.date&&v.slot)SNAPS[`${v.date}_${v.slot}`]=v});renderPickers();renderAll();refreshSave()}
   catch(e){$('#d-empty').hidden=false;$('#d-empty').innerHTML='<p class="note">Saved snapshots could not be loaded. The server may be waking up; reload the page in a minute.</p>'}};
  await load();setInterval(()=>{if(document.visibilityState==='visible'&&!st.pending)load()},120000);return}
